<html lang="fa" dir="rtl">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شرکت تجارتی بنائی خالد</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:"Vazirmatn",Tahoma,sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(255,255,255,.95),transparent 30%),
        radial-gradient(circle at 90% 85%,rgba(255,255,255,.9),transparent 28%),
        linear-gradient(135deg,#d9efff,#edf8ff,#d8edff);
    color:#173b68;
    min-height:100vh;
}

/* موج‌های ظریف پس‌زمینه */
body:before,
body:after{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    border:1px solid rgba(30,120,210,.10);
    border-radius:50%;
    pointer-events:none;
    z-index:0;
}

body:before{
    top:-250px;
    left:-180px;
}

body:after{
    bottom:-260px;
    right:-170px;
}

.container{
    width:min(960px,94%);
    margin:auto;
    padding:18px 0 30px;
    position:relative;
    z-index:1;
}

/* کارت اصلی */
.main-card{
    background:rgba(255,255,255,.94);
    border-radius:30px;
    padding:28px 22px 25px;
    box-shadow:
        0 15px 45px rgba(25,90,150,.12),
        0 2px 8px rgba(25,90,150,.08);
    border:1px solid rgba(255,255,255,.95);
    text-align:center;
}

/* لوگو */
.logo-box{
    width:125px;
    height:125px;
    margin:0 auto 14px;
    background:white;
    border-radius:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 10px 30px rgba(30,80,130,.14);
}

.logo-box svg{
    width:100px;
    height:100px;
}

/* نام شرکت */
.company-fa{
    font-size:clamp(25px,5vw,43px);
    font-weight:800;
    color:#063b78;
    margin:5px 0 5px;
    line-height:1.5;
}

.company-en{
    color:#e25735;
    font-family:Georgia,serif;
    font-size:clamp(18px,3vw,26px);
    font-weight:bold;
    margin:2px 0 13px;
}

.tagline{
    font-size:16px;
    color:#40546b;
    font-weight:500;
}

/* عنوان بخش */
.section-title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin:30px 0 15px;
    color:#064a91;
}

.section-title:before,
.section-title:after{
    content:"";
    height:3px;
    width:75px;
    border-radius:10px;
    background:linear-gradient(90deg,#1686d9,rgba(22,134,217,.1));
}

.section-title:after{
    background:linear-gradient(270deg,#1686d9,rgba(22,134,217,.1));
}

.section-title h2{
    margin:0;
    font-size:25px;
    font-weight:800;
    white-space:nowrap;
}

.section-title i{
    font-size:27px;
}
