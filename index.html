<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شرکت تجارتی بنائی خالد</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:linear-gradient(145deg,#dff2ff,#eef8ff,#d7edff);
    color:#142536;
}

.container{
    max-width:650px;
    margin:auto;
    padding:22px 16px 50px;
}

/* Header */
.header{
    background:rgba(255,255,255,.94);
    border-radius:32px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 12px 35px rgba(20,80,130,.12);
    border:1px solid rgba(255,255,255,.8);
}

.logo{
    width:130px;
    height:130px;
    margin:0 auto 18px;
    border-radius:32px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 8px 25px rgba(0,0,0,.10);
    overflow:hidden;
}

/* لوگوی BK */
.logo svg{
    width:115px;
    height:115px;
}

.company-name{
    font-size:28px;
    font-weight:bold;
    color:#073e78;
    margin:8px 0 12px;
}

.company-en{
    font-size:18px;
    color:#e15b4b;
    font-weight:bold;
    margin-bottom:18px;
}

.description{
    font-size:18px;
    color:#596b7b;
    line-height:1.9;
}

/* Section */
.section{
    margin-top:35px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:#064783;
    font-size:25px;
    font-weight:bold;
    margin-bottom:18px;
}

.section-title::before,
.section-title::after{
    content:"";
    height:3px;
    background:#2184ce;
    flex:1;
    border-radius:10px;
}

.section-icon{
    font-size:29px;
}

/* Cards */
.card{
    background:rgba(255,255,255,.95);
    border-radius:25px;
    margin:14px 0;
    min-height:105px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    box-shadow:0 8px 22px rgba(30,100,150,.12);
    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);
}

.info{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:21px;
    color:#263746;
    direction:ltr;
}

.number{
    letter-spacing:1px;
}

.button{
    width:62px;
    height:62px;
    border-radius:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-decoration:none;
    flex-shrink:0;
}

.button svg{
    width:34px;
    height:34px;
    fill:white;
}

.call{
    background:#1685d9;
}

.whatsapp{
    background:#25D366;
}

.telegram{
    background:#229ED9;
}

.instagram{
    background:linear-gradient(135deg,#833AB4,#E1306C,#F77737);
}

/* Empty social cards */
.empty{
    opacity:.78;
}

.empty-text{
    color:#7a8995;
    font-size:17px;
}

.disabled{
    background:#d7e0e7;
    cursor:default;
}

/* Footer */
.footer{
    text-align:center;
    margin-top:40px;
    color:#647789;
    font-size:14px;
    line-height:2;
}

@media(max-width:420px){

    .company-name{
        font-size:24px;
    }

    .company-en{
        font-size:16px;
    }

    .description{
        font-size:16px;
    }

    .section-title{
        font-size:22px;
    }

    .number{
        font-size:17px;
    }

    .button{
        width:58px;
        height:58px;
    }
}
</style>
</head>
